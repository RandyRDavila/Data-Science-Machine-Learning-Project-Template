name: Project quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Reproduce locked environment
        run: uv sync --locked

      - name: Prepare package and notebook kernel
        run: uv run python scripts/setup_project.py

      - name: Check Python style
        run: uv run ruff check src tests scripts

      - name: Build package
        run: uv build

      - name: Run tests and executable examples
        run: uv run pytest -q

      - name: Run end-to-end smoke path
        run: uv run python scripts/smoke_test.py

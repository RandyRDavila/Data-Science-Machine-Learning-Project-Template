name: Bug report
description: Report reproducible incorrect behavior without sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and safe fixture data, never secrets or private records.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and revision
    validations:
      required: true

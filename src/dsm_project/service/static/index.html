<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSM Project Demonstration</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #f4f7fa; color: #18212b; }
      main { max-width: 760px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 8px 30px #00205b1a; }
      h1 { color: #00205b; }
      textarea { box-sizing: border-box; width: 100%; min-height: 8rem; font-family: monospace; }
      button { margin-top: 1rem; padding: .7rem 1rem; background: #00205b; color: white; border: 0; border-radius: 6px; cursor: pointer; }
      pre { overflow-x: auto; background: #eef2f5; padding: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>DSM Project Demonstration</h1>
      <p>This minimal client proves that the browser, API, and model artifact are connected. Replace it with an interface designed around your users.</p>
      <label for="rows">Rows in documented model feature order</label>
      <textarea id="rows">[[14.23, 1.71, 2.43, 15.6, 127, 2.8, 3.06, 0.28, 2.29, 5.64, 1.04, 3.92, 1065]]</textarea>
      <button id="predict">Request prediction</button>
      <pre id="result">No request sent.</pre>
    </main>
    <script>
      document.querySelector("#predict").addEventListener("click", async () => {
        const output = document.querySelector("#result");
        try {
          const rows = JSON.parse(document.querySelector("#rows").value);
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ rows })
          });
          output.textContent = JSON.stringify(await response.json(), null, 2);
        } catch (error) {
          output.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
